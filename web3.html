<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Tech Sentiment Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #f8f9fa; min-height: 100vh; }
    
    /* === 首页样式 === */
    .home-header { padding: 40px 0 20px; text-align: center; }
    .hero-title { font-weight: 800; color: #2c3e50; letter-spacing: -1px; }
    /* .hero-subtitle 已删除 */
    
    .home-card { 
      cursor: pointer; 
      transition: all 0.2s ease; 
      border: none; 
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
      height: 100%;
    }
    .home-card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 12px 20px rgba(0,0,0,0.1); 
    }
    .company-logo-placeholder {
      width: 48px; height: 48px; 
      background: #e9ecef; border-radius: 8px; 
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #6c757d; font-size: 1.2rem;
      margin-bottom: 15px;
    }

    /* === 详情页样式 === */
    .detail-page { display: none; padding-top: 20px; }
    .back-btn { font-weight: 600; color: #6c757d; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
    .back-btn:hover { color: #0d6efd; }
    
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; }
    .card-header { background-color: #fff; border-bottom: 1px solid #eee; font-weight: 600; }
    .article-card { padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
    .article-card:last-child { border-bottom: none; }
  </style>
</head>

<body>

<div class="container" id="homePage">
  <div class="home-header">
    <h1 class="display-5 hero-title mb-2">Big Tech Sentiment Tracker</h1>
    </div>

  <div class="row g-4" id="homeCardsContainer">
    <div class="text-center text-muted py-5">Loading companies...</div>
  </div>
</div>

<div class="container-fluid detail-page" id="detailPage">
  <div class="row mb-3 align-items-center">
    <div class="col-auto">
      <div class="back-btn" onclick="goHome()">
        <span class="fs-5 me-1">←</span> Back to Home
      </div>
    </div>
    <div class="col"></div>
  </div>

  <div class="row mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body py-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label class="form-label small text-muted">Company</label>
              <select id="companySelect" class="form-select fw-bold"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted">Start date</label>
              <input id="startDate" type="date" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted">End date</label>
              <input id="endDate" type="date" class="form-control">
            </div>
            <div class="col-md-2">
              <button id="applyBtn" class="btn btn-primary w-100">Apply</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-3 align-items-stretch">
    <div class="col-lg-8 col-md-7 mb-3 mb-md-0 d-flex flex-column">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Sentiment Trend</span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="setRange(15)">15D</button>
            <button class="btn btn-outline-secondary" onclick="setRange(30)">1M</button>
            <button class="btn btn-outline-secondary" onclick="setRange(90)">3M</button>
            <button class="btn btn-outline-secondary" onclick="setRange(180)">6M</button>
            <button class="btn btn-outline-secondary" onclick="setRange(365)">1Y</button>
          </div>
        </div>
        <div class="card-body flex-grow-1 d-flex align-items-center justify-content-center p-0">
          <div style="position: relative; width: 100%; height: 350px; padding: 1rem;">
            <canvas id="sentimentLine"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4 col-md-5 d-flex flex-column">
      <div class="card mb-3">
        <div class="card-body">
          <h5 id="statsTitle" class="fw-bold mb-3"></h5>
          <div class="row text-center">
            <div class="col-6 border-end">
              <div class="text-muted small text-uppercase" style="font-size: 0.7rem;"> Sentiment Score</div>
              <div id="overallAvgSentiment" class="fs-3 fw-bold text-primary">-</div>
            </div>
            <div class="col-6">
              <div class="text-muted small text-uppercase" style="font-size: 0.7rem;">Articles</div>
              <div id="overallArticleCount" class="fs-3 fw-bold text-dark">-</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card flex-grow-1">
        <div class="card-header">Sentiment Breakdown</div>
        <div class="card-body flex-grow-1 d-flex align-items-center justify-content-center p-0">
          <div style="position: relative; width: 100%; height: 100%; min-height: 200px; padding: 1rem;">
            <canvas id="sentimentPie"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">Recent News</div>
        <div class="card-body" id="articlesContainer">
          Loading articles...
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "http://127.0.0.1:5001";
  let pieChart = null;
  let lineChart = null;

  // --- 页面切换逻辑 ---
  function goDashboard(companyName) {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("detailPage").style.display = "block";
    
    const select = document.getElementById("companySelect");
    select.value = companyName;
    setRange(30); 
  }

  function goHome() {
    document.getElementById("detailPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";
  }

  // --- 工具函数 ---
  function fixDate(d) { return d ? d : null; }

  function sentimentBadge(score, rawLabel) {
    const label = (rawLabel || "").toLowerCase();
    let color = "#95a5a6"; 
    if (label === "positive") color = "#2ecc71";
    if (label === "negative") color = "#e74c3c";
    const s = score === null || score === undefined ? "N/A" : score.toFixed(3);
    return `<span class="badge" style="background-color:${color};">${label.toUpperCase()} | ${s}</span>`;
  }

  function getScoreColor(score) {
    if (score > 0.1) return "#2ecc71"; // Green
    if (score < -0.1) return "#e74c3c"; // Red
    return "#95a5a6"; // Gray
  }

  // --- 核心数据加载 ---
  
  async function loadCompanySummary() {
    try {
      const res = await fetch(`${API_BASE}/api/company_summary`);
      const data = await res.json();
      
      const container = document.getElementById("homeCardsContainer");
      const select = document.getElementById("companySelect");
      
      container.innerHTML = "";
      select.innerHTML = "";

      data.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.company;
        opt.textContent = c.company;
        select.appendChild(opt);

        const scoreColor = getScoreColor(c.avg_sentiment);
        const col = document.createElement("div");
        col.className = "col-md-6 col-lg-4";
        
        // 修改：去除了 Emoji 和文章数量统计，只保留日期
        col.innerHTML = `
          <div class="card home-card p-4" onclick="goDashboard('${c.company}')" style="border-left: 5px solid ${scoreColor}">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div class="company-logo-placeholder">
                ${c.company.charAt(0)}
              </div>
              <h4 class="mb-0 fw-bold" style="color: ${scoreColor}">${c.avg_sentiment?.toFixed(3)}</h4>
            </div>
            <h5 class="fw-bold text-dark">${c.company}</h5>
            <div class="text-muted small mt-2">
              ${c.first_date} ~ ${c.last_date}
            </div>
          </div>
        `;
        container.appendChild(col);
      });

    } catch (e) {
      console.error(e);
      document.getElementById("homeCardsContainer").innerHTML = `<div class="alert alert-danger">API Error: ${e.message}</div>`;
    }
  }

  function setRange(days) {
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - days);
    document.getElementById("endDate").value = end.toISOString().split("T")[0];
    document.getElementById("startDate").value = start.toISOString().split("T")[0];
    loadStatsAndArticles();
  }

  async function loadStatsAndArticles() {
    const company = document.getElementById("companySelect").value;
    const start = fixDate(document.getElementById("startDate").value);
    const end = fixDate(document.getElementById("endDate").value);

    const params = new URLSearchParams({ company });
    if (start) params.append("start", start);
    if (end) params.append("end", end);

    try {
      // 1. Fetch Stats
      const sres = await fetch(`${API_BASE}/api/company_stats?` + params);
      const stats = await sres.json();

      document.getElementById("statsTitle").textContent = stats.company;
      document.getElementById("overallAvgSentiment").textContent = 
        stats.overall.avg_sentiment !== null ? stats.overall.avg_sentiment.toFixed(4) : "-";
      document.getElementById("overallAvgSentiment").style.color = getScoreColor(stats.overall.avg_sentiment);
      document.getElementById("overallArticleCount").textContent = stats.overall.article_count ?? "-";

      updatePie(stats.breakdown);
      updateLine(stats.time_series, stats.overall.avg_sentiment);

      // 2. Fetch Articles
      const aparams = new URLSearchParams({ company, sort: "newest", page: 1, limit: 20 });
      if (start) aparams.append("start", start);
      if (end) aparams.append("end", end);

      const ares = await fetch(`${API_BASE}/api/articles?` + aparams);
      const ajson = await ares.json();
      const wrap = document.getElementById("articlesContainer");
      wrap.innerHTML = "";

      if (!ajson.items || ajson.items.length === 0) {
        wrap.innerHTML = "<p class='text-muted'>No articles found.</p>";
      } else {
        ajson.items.forEach(a => {
          const cleanTitle = a.title ? a.title.replace(/\[.*?\]/g, "").trim() : "No Title";
          const div = document.createElement("div");
          div.className = "article-card";
          div.innerHTML = `
            <div class="d-flex justify-content-between">
              <div class="me-3">
                <a href="${a.url || '#'}" target="_blank" class="fw-bold text-dark text-decoration-none">${cleanTitle}</a>
                <div class="small text-muted mt-1">${a.source || 'Source'} • ${a.published_at}</div>
              </div>
              <div>${sentimentBadge(a.sentiment_score, a.sentiment_label)}</div>
            </div>
            <div class="text-muted small mt-2">${a.description || (a.content ? a.content.slice(0,180)+'...' : '')}</div>
          `;
          wrap.appendChild(div);
        });
      }
    } catch(e) { console.error(e); }
  }

  function updatePie(breakdown) {
    if (pieChart) pieChart.destroy();
    const ctx = document.getElementById("sentimentPie").getContext("2d");
    const dataVals = breakdown ? [breakdown.Positive||0, breakdown.Neutral||0, breakdown.Negative||0] : [0,0,0];

    pieChart = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Positive", "Neutral", "Negative"],
        datasets: [{
          data: dataVals,
          backgroundColor: ["#2ecc71", "#ecf0f1", "#e74c3c"],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '65%',
        plugins: {
          legend: { position: "right", labels: { usePointStyle: true, boxWidth: 8 } }
        },
        layout: { padding: 10 }
      }
    });
  }

  // --- 动态平均值基准线 ---
 // --- 优化后的 updateLine 函数 (接收总体平均分) ---
// --- 优化后的 updateLine (颜色加深版) ---
  function updateLine(ts, overallAvg) {
    if (lineChart) lineChart.destroy();
    const ctx = document.getElementById("sentimentLine").getContext("2d");
    if(!ts) ts = [];
    
    // 1. 提取数据
    const labels = ts.map(t => t.date);
    const sentimentVals = ts.map(t => t.avg_sentiment);
    // 确保后端有 article_count 字段，没有则默认为 0
    const volumeVals = ts.map(t => t.article_count || 0); 

    // 计算 Volume 的最大值，用于设置 Y 轴比例
    const maxVolume = Math.max(...volumeVals);
    // 依然保持 4 倍比例，让柱子只占据底部 1/4
    const volumeAxisMax = maxVolume > 0 ? maxVolume * 4 : 10; 

    const benchmarkValue = (overallAvg !== undefined && overallAvg !== null) ? overallAvg : 0;

    // 平均线插件 (保持不变)
    const averageLinePlugin = {
      id: 'averageLine',
      afterDatasetsDraw: (chart) => {
        const ctx = chart.ctx;
        const yAxis = chart.scales.y;
        const xAxis = chart.scales.x;
        
        if (benchmarkValue >= yAxis.min && benchmarkValue <= yAxis.max) {
          const yPos = yAxis.getPixelForValue(benchmarkValue);
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(xAxis.left, yPos);
          ctx.lineTo(xAxis.right, yPos);
          ctx.lineWidth = 2; 
          ctx.strokeStyle = '#e74c3c'; 
          ctx.setLineDash([10, 6]);     
          ctx.stroke();
          
          const text = `Score: ${benchmarkValue.toFixed(4)}`;
          ctx.font = 'bold 11px sans-serif';
          const textWidth = ctx.measureText(text).width;
          const padding = 4;
          const rectX = xAxis.right - textWidth - padding * 2;
          const rectY = yPos - 20; 
          
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.fillRect(rectX, rectY, textWidth + padding * 2, 16);
          
          ctx.fillStyle = '#c0392b'; 
          ctx.textAlign = 'right';
          ctx.textBaseline = 'bottom';
          ctx.fillText(text, xAxis.right - padding, yPos - 4);
          ctx.restore();
        }
      }
    };

    lineChart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          // Dataset 1: 情绪折线
          {
            label: "Sentiment",
            data: sentimentVals,
            yAxisID: 'y', 
            tension: 0.3, 
            pointRadius: sentimentVals.length > 50 ? 0 : 3, 
            pointHoverRadius: 5,
            borderColor: "#3498db",
            backgroundColor: "rgba(52, 152, 219, 0.05)",
            fill: true,
            borderWidth: 1.5,
            order: 1 
          },
          // Dataset 2: 新闻量柱状图 (颜色已加深)
          {
            label: "Articles",
            data: volumeVals,
            type: 'bar', 
            yAxisID: 'y1', 
            // 【修改点】：颜色加深到 0.2 (20% 黑)，悬停加深到 0.4 (40% 黑)
            backgroundColor: "rgba(0, 0, 0, 0.2)", 
            hoverBackgroundColor: "rgba(0, 0, 0, 0.4)", 
            barPercentage: 0.6, 
            categoryPercentage: 0.8,
            order: 2 
          }
        ]
      },
      plugins: [averageLinePlugin], 
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { 
          mode: 'index', 
          intersect: false 
        },
        scales: {
          x: { 
            grid: { display: false },
            ticks: { maxTicksLimit: 10 } 
          },
          y: { 
            type: 'linear',
            display: true,
            position: 'left',
            grid: { borderDash: [2, 4], color: '#eee' },
            title: { display: false } 
          },
          // 右侧 Y 轴 (隐藏)
          y1: {
            type: 'linear',
            display: false, 
            position: 'right',
            min: 0,
            max: volumeAxisMax, 
            grid: { display: false } 
          }
        },
        plugins: { 
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                let label = context.dataset.label || '';
                if (label) {
                  label += ': ';
                }
                if (context.parsed.y !== null) {
                   if(context.dataset.label === "Sentiment") {
                     label += context.parsed.y.toFixed(4);
                   } else {
                     label += context.parsed.y;
                   }
                }
                return label;
              }
            }
          }
        }
      }
    });
  }


  
  document.getElementById("applyBtn").onclick = loadStatsAndArticles;
  document.getElementById("companySelect").onchange = loadStatsAndArticles;

  window.onload = () => {
    loadCompanySummary();
  };
</script>
</body>
</html>
